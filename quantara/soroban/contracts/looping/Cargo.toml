[package]
name = "looping"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0.0" }
common = { path = "../common", version = "0.1.0" }

[dev-dependencies]
proptest = "1.4.0"
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
ed25519-dalek = "<3"
rand_core = "<0.7"
